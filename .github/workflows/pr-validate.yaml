---
name: "Pull Request: Validate"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.head_ref }}-pr-validate
  cancel-in-progress: true

jobs:
  pr-metadata:
    uses: anthr76/kfk8s/.github/workflows/pr-metadata.yaml@d6f172baae6d9a46dae2d20932df924a81684ccb # main

  generate-build-matrix:
    name: Generate matrix for building images
    runs-on: ubuntu-22.04
    needs:
      - pr-metadata
    outputs:
      matrix: ${{ steps.get-changed.outputs.changes }}
    if: ${{ needs.pr-metadata.outputs.addedOrModifiedImages }} != '[]'
    steps:
      - name: Install tools
        run: sudo apt-get install moreutils jo

      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 0

      - name: Fetch modified images
        id: get-changed
        shell: bash
        run: |
          declare -a changes_array=()
          while read -r app
          do
            while read -r channel
            do
              change="$(jo app="$app" channel="$channel")"
              changes_array+=($change)
            done < <(jq --raw-output -c '.channels[] | .name' "./k8s/$app/metadata.json")
          done < <(echo '${{ needs.pr-metadata.outputs.addedOrModifiedImages }}' | jq --raw-output -c '.[]')

          output="$(jo -a ${changes_array[*]})"
          echo "changes=${output}" >> $GITHUB_OUTPUT

  images-build:
    uses: anthr76/kfk8s/.github/workflows/action-image-build.yaml@d6f172baae6d9a46dae2d20932df924a81684ccb # main
    needs:
      - generate-build-matrix
    with:
      imagesToBuild: "${{ needs.generate-build-matrix.outputs.matrix }}"
      updateMetadata: "false"
    secrets: inherit
